<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a10">
<title>Lofi Russia · Москва</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#07060a;overflow:hidden}
  #stage{position:fixed;inset:0;overflow:hidden}
  canvas{position:absolute;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  #hud{position:fixed;left:24px;top:20px;color:#eadfca;font-family:'Press Start 2P',monospace;
       pointer-events:none;text-shadow:0 2px 0 rgba(0,0,0,.7);transition:opacity .4s}
  #hud .k{font-size:9px;letter-spacing:3px;opacity:.5}
  #hud h1{font-size:22px;margin:12px 0;font-weight:400}
  #hud .s{font-size:9px;opacity:.6;line-height:1.6}
  #hud.off,#player.off{opacity:0;pointer-events:none}

  /* ---------- player ---------- */
  #player{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:6px;
          padding:8px 14px 8px 8px;border-radius:18px;background:rgba(10,12,28,.84);border:1px solid rgba(255,255,255,.07);
          box-shadow:0 10px 40px rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
          color:#e9e4f2;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;transition:opacity .4s;user-select:none;
          max-width:calc(100vw - 32px);box-sizing:border-box}
  #player button{all:unset;cursor:pointer;display:grid;place-items:center;width:44px;height:44px;border-radius:12px;color:#d6d2e4}
  #player button:hover{background:rgba(255,255,255,.07);color:#fff}
  #player button:focus-visible{outline:2px solid #e8a868;outline-offset:2px}
  #player svg{width:18px;height:18px;shape-rendering:crispEdges;fill:currentColor}
  #player svg[hidden]{display:none}
  #play{width:52px!important;height:52px!important;background:#e8a868!important;color:#1a1322!important;border-radius:14px!important;
        box-shadow:0 0 0 5px rgba(232,168,104,.12)}
  #play:hover{background:#f2b77a!important}
  #play svg{width:20px;height:20px}
  .meta{min-width:0;width:230px;padding:0 10px}
  .meta .title{font-family:'Press Start 2P',monospace;font-size:11px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta .sub{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;color:#8f8aa6;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta .bar{height:2px;background:rgba(255,255,255,.08);margin-top:6px;border-radius:2px;overflow:hidden}
  .meta .bar i{display:block;height:100%;width:0;background:#e8a868}
  .vol{display:flex;align-items:center;gap:8px;color:#8f8aa6;padding:0 6px}
  .vol svg{width:16px;height:16px}
  .vol input{-webkit-appearance:none;appearance:none;width:110px;height:8px;border-radius:8px;cursor:pointer;
             background:linear-gradient(90deg,#e8a868 var(--v,50%),#34324a var(--v,50%))}
  .vol input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#e8a868;border:3px solid #1a1628}
  .vol input::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#e8a868;border:3px solid #1a1628}
  .sep{width:1px;height:28px;background:rgba(255,255,255,.08);margin:0 4px}
  @media (max-width:760px){ .vol,.sep,#fs{display:none!important} .meta{width:auto;flex:1} }
  /* phones in landscape: compact player and title so the scene stays visible */
  @media (max-height:520px){
    .vol,.sep{display:none!important}
    #player{bottom:calc(10px + env(safe-area-inset-bottom));padding:5px 8px 5px 5px;border-radius:14px}
    #player button{width:36px;height:36px}
    #play{width:40px!important;height:40px!important;border-radius:11px!important}
    .meta{width:180px}
    .meta .title{font-size:9px}
    .meta .sub{font-size:11px}
    #hud{left:16px;top:12px}
    #hud h1{font-size:15px;margin:8px 0}
  }
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="hud">
  <div class="k">LOFI RUSSIA</div>
  <h1>Москва</h1>
  <div class="s"><span id="t">--:--</span></div>
</div>
<div id="player">
  <button id="play" aria-label="Play">
    <svg viewBox="0 0 9 9" id="ico-play"><rect x="3" y="1" width="1" height="7"/><rect x="4" y="2" width="1" height="5"/><rect x="5" y="3" width="1" height="3"/><rect x="6" y="4" width="1" height="1"/></svg>
    <svg viewBox="0 0 9 9" id="ico-pause" hidden><rect x="2" y="1" width="2" height="7"/><rect x="5" y="1" width="2" height="7"/></svg>
  </button>
  <button id="next" aria-label="Следующий трек" title="Следующий трек (N)">
    <svg viewBox="0 0 9 9"><rect x="1" y="1" width="1" height="7"/><rect x="2" y="2" width="1" height="5"/><rect x="3" y="3" width="1" height="3"/><rect x="4" y="4" width="1" height="1"/><rect x="6" y="1" width="2" height="7"/></svg>
  </button>
  <div class="meta">
    <div class="title" id="p-title">Нажми play</div>
    <div class="sub" id="p-sub">lofi для зимней Москвы</div>
    <div class="bar"><i id="p-bar"></i></div>
  </div>
  <div class="sep"></div>
  <label class="vol" title="Музыка">
    <svg viewBox="0 0 9 9"><rect x="5" y="1" width="1" height="6"/><rect x="6" y="1" width="2" height="1"/><rect x="7" y="2" width="1" height="1"/><rect x="2" y="6" width="3" height="2"/><rect x="3" y="5" width="2" height="1"/></svg>
    <input type="range" id="v-music" min="0" max="100" value="80" aria-label="Громкость музыки">
  </label>
  <label class="vol" title="Снег и винил">
    <svg viewBox="0 0 9 9"><rect x="4" y="1" width="1" height="7"/><rect x="1" y="4" width="7" height="1"/><rect x="2" y="2" width="1" height="1"/><rect x="6" y="2" width="1" height="1"/><rect x="2" y="6" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/></svg>
    <input type="range" id="v-amb" min="0" max="100" value="45" aria-label="Громкость атмосферы">
  </label>
  <div class="sep"></div>
  <button id="fs" aria-label="Полный экран" title="Полный экран (F)">
    <svg viewBox="0 0 9 9"><rect x="1" y="1" width="3" height="1"/><rect x="1" y="1" width="1" height="3"/><rect x="5" y="1" width="3" height="1"/><rect x="7" y="1" width="1" height="3"/><rect x="1" y="7" width="3" height="1"/><rect x="1" y="5" width="1" height="3"/><rect x="5" y="7" width="3" height="1"/><rect x="7" y="5" width="1" height="3"/></svg>
  </button>
</div>
<script>
// ---------- basics ----------
// Scene is 480 wide; the original 400px composition sits at offset OX.
// Screens wider than 16:10 crop the floor, narrower ones crop the sides.
const W = 480, H = 300, OX = 40;
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');

function mk(w = W, h = H) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rng(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
const bay = (x, y) => BAYER[(y & 3) * 4 + (x & 3)];
function hex(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function R(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(x, y, w, h); }
function P(c, x, y, col) { c.fillStyle = col; c.fillRect(x, y, 1, 1); }
function ellipse(c, cx, cy, rx, ry, col, maxY = 1e9) {
  c.fillStyle = col;
  for (let y = -ry; y <= ry; y++) {
    if (cy + y > maxY) continue;
    const w = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry))));
    c.fillRect(Math.round(cx - w), Math.round(cy + y), w * 2 + 1, 1);
  }
}
function line(c, x0, y0, x1, y1, col) {
  x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  for (;;) {
    P(c, x0, y0, col);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e;
    if (e2 >= dy) { e += dy; x0 += sx; }
    if (e2 <= dx) { e += dx; y0 += sy; }
  }
}
function ditherV(c, x0, y0, w, h, cols) {
  // putImageData ignores transforms, so apply the translation by hand
  const tf = c.getTransform(); x0 += tf.e; y0 += tf.f;
  const pal = cols.map(hex), n = pal.length - 1;
  const img = c.getImageData(x0, y0, w, h), d = img.data;
  for (let y = 0; y < h; y++) {
    const t = y / (h - 1) * n;
    for (let x = 0; x < w; x++) {
      let i = Math.floor(t); if (t - i > bay(x0 + x, y0 + y)) i++;
      const p = pal[Math.min(i, n)], k = (y * w + x) * 4;
      d[k] = p[0]; d[k + 1] = p[1]; d[k + 2] = p[2]; d[k + 3] = 255;
    }
  }
  c.putImageData(img, x0, y0);
}
function glow(c, x, y, r, rgb, a) {
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${rgb},${a})`);
  g.addColorStop(1, `rgba(${rgb},0)`);
  c.fillStyle = g; c.fillRect(x - r, y - r, r * 2, r * 2);
}

// window glass rect (screen coords)
const GX = 117, GY = 43, GW = 166, GH = 134;
const PANES = [[117, 43, 81, 33], [202, 43, 81, 33], [117, 80, 81, 97], [202, 80, 81, 97]];

// ---------- tiny pixel font ----------
const GLYPH = {
  'К': ['1.1', '11.', '1..', '11.', '1.1'],
  'А': ['.1.', '1.1', '111', '1.1', '1.1'],
  'Ф': ['.1.', '111', '1.1', '111', '.1.'],
  'Е': ['111', '1..', '11.', '1..', '111'],
};
function text(c, s, x, y, col) {
  for (const ch of s) {
    const g = GLYPH[ch];
    g.forEach((row, j) => [...row].forEach((v, i) => { if (v === '1') P(c, x + i, y + j, col); }));
    x += 4;
  }
}

// =====================================================================
// CITY (local coords inside glass, GW x GH)
// =====================================================================
const cityC = mk(GW, GH);
const cityWin = [];            // facade windows that can switch on/off
const stars = [];
const blinkers = [];           // aviation lights
const chimneys = [[8, 88], [38, 88], [161, 92]];

function onion(c, cx, top, ws, A, B, mode) {
  ws.forEach((w, i) => {
    const y = top + i;
    for (let k = 0; k < w; k++) {
      const x = cx - (w >> 1) + k;
      let s;
      if (mode === 'spiral') s = ((x - cx + i + 40) >> 1) & 1;
      else if (mode === 'check') s = (x + (i >> 1)) & 1;
      else s = ((x - cx + 40) >> 1) & 1;
      P(c, x, y, s ? A : B);
    }
    // soft highlight on left edge
    P(c, cx - (w >> 1), y, 'rgba(255,255,255,0.18)');
  });
  const gold = '#f0c850';
  P(c, cx, top - 1, gold); P(c, cx, top - 2, gold); P(c, cx, top - 3, gold); P(c, cx, top - 4, gold);
  P(c, cx - 1, top - 3, gold); P(c, cx + 1, top - 3, gold);
}
function drum(c, cx, y0, y1, w) {
  // red brick drum with white stone trims and arched windows
  R(c, cx - (w >> 1), y0, w, y1 - y0, '#b0422e');
  R(c, cx - (w >> 1), y0, 1, y1 - y0, '#c85a42');
  R(c, cx + (w >> 1), y0, 1, y1 - y0, '#7a2a1e');
  R(c, cx - (w >> 1), y0, w, 1, '#e8dcc4');
  for (let y = y0 + 3; y < y1 - 2; y += 6) { R(c, cx - 1, y - 1, 3, 1, '#e8dcc4'); P(c, cx, y, '#3a1410'); P(c, cx, y + 1, '#3a1410'); }
}

function drawCity() {
  const c = cityC.getContext('2d');
  const r = rng(42);
  // sky
  ditherV(c, 0, 0, GW, 114, ['#05081c', '#080d27', '#0d1334', '#131a42', '#1d1e4c', '#2b2352', '#3f2a56', '#5a3454', '#74404f']);

  // stars
  for (let i = 0; i < 55; i++) {
    const x = Math.floor(r() * GW), y = Math.floor(r() * 62);
    const bright = r() < 0.25;
    P(c, x, y, bright ? '#dfe4ff' : '#6d78b0');
    if (r() < 0.35) stars.push({ x, y, p: r() * 6.28, s: 1 + r() * 2 });
  }

  // moon + halo
  const mx = 150, my = 16;
  for (let y = my - 18; y <= my + 18; y++) for (let x = mx - 18; x <= mx + 18; x++) {
    const d = Math.hypot(x - mx, y - my);
    if (d > 7.5 && d < 18) {
      const p = (1 - (d - 7.5) / 10.5);
      if (p * 0.8 > bay(x, y)) P(c, x, y, d < 11 ? '#3a4380' : '#232a62');
    }
  }
  ellipse(c, mx, my, 7, 7, '#efe8c8');
  ellipse(c, mx + 1, my, 6, 6, '#f7f2da');
  [[147, 13], [148, 13], [152, 18], [153, 18], [152, 19], [146, 19], [155, 13]].forEach(([x, y]) => P(c, x, y, '#d6cfae'));

  // ---- far: Ostankino ----
  const oc = '#1a1b40', ohl = '#2b2d5e';
  R(c, 18, 14, 1, 16, oc);
  R(c, 17, 30, 3, 14, oc); R(c, 17, 30, 1, 14, ohl);
  R(c, 14, 44, 9, 4, oc); R(c, 14, 44, 9, 1, ohl);
  for (let x = 15; x < 22; x += 2) P(c, x, 46, '#e8b870');
  R(c, 17, 48, 3, 34, oc); R(c, 17, 48, 1, 34, ohl);
  for (let y = 82; y < 100; y++) { const w = 3 + Math.floor((y - 82) / 3) * 2; R(c, 18 - (w >> 1), y, w, 1, oc); }
  blinkers.push({ x: 18, y: 13, p: 0 }, { x: 18, y: 36, p: 0.5 }, { x: 18, y: 62, p: 1.0 });

  // ---- far: Stalin high-rise (MSU-like) ----
  const sb = '#1c1a3d', sl = '#2e2954';
  const tiers = [[36, 84, 49, 20], [40, 73, 8, 11], [73, 73, 8, 11], [49, 62, 23, 22], [52, 50, 17, 12], [55, 41, 11, 9], [57, 35, 7, 6], [59, 30, 3, 5]];
  tiers.forEach(([x, y, w, h]) => {
    R(c, x, y, w, h, sb); R(c, x, y, 1, h, sl); R(c, x, y, w, 1, sl);
    for (let yy = y + 2; yy < y + h - 1; yy += 3) for (let xx = x + 2; xx < x + w - 1; xx += 2)
      if (r() < 0.22) P(c, xx, yy, r() < 0.5 ? '#c89050' : '#e8b868');
  });
  R(c, 43, 66, 1, 7, sb); R(c, 76, 66, 1, 7, sb);
  R(c, 60, 16, 1, 14, sb);
  P(c, 60, 13, '#f0c050'); R(c, 59, 14, 3, 1, '#f0c050'); P(c, 60, 15, '#c89a38');

  // ---- far: Moscow City ----
  const towers = [
    { x: 121, w: 8, top: 40, c: '#16224a', win: '#7aa0e0' },
    { x: 129, w: 9, top: 26, c: '#1a2850', win: '#8ab4f4', spire: 1 },
    { x: 138, w: 8, top: 34, c: '#2a2034', win: '#e8b068', pyr: 1 },
    { x: 146, w: 9, top: 44, c: '#182448', win: '#98bcf4', round: 1 },
    { x: 155, w: 8, top: 56, c: '#15203e', win: '#7090d0' },
  ];
  towers.forEach(t => {
    R(c, t.x, t.top, t.w, 110 - t.top, t.c);
    if (t.spire) { for (let i = 1; i <= 4; i++) { const w = t.w - (5 - i) * 2; if (w > 0) R(c, t.x + ((t.w - w) >> 1), t.top - 5 + i, w, 1, t.c); } R(c, t.x + (t.w >> 1), t.top - 9, 1, 5, t.c); }
    if (t.pyr) { R(c, t.x + 1, t.top - 2, t.w - 2, 2, t.c); R(c, t.x + 2, t.top - 4, t.w - 4, 2, t.c); R(c, t.x + 3, t.top - 6, t.w - 6, 2, '#6a4a30'); }
    if (t.round) { R(c, t.x + 1, t.top - 1, t.w - 2, 1, t.c); R(c, t.x + 2, t.top - 2, t.w - 4, 1, t.c); }
    for (let y = t.top + 1; y < 108; y += 2) for (let x = t.x + 1; x < t.x + t.w - 1; x += 2)
      P(c, x, y, r() < 0.33 ? t.win : 'rgba(80,100,160,0.35)');
    R(c, t.x + t.w - 1, t.top, 1, 110 - t.top, 'rgba(140,170,230,0.18)');
    blinkers.push({ x: t.x + (t.w >> 1), y: t.top - (t.spire ? 10 : t.pyr ? 7 : 3), p: r() * 2 });
  });

  // ---- mid: Kremlin wall ----
  ditherV(c, 0, 94, GW, 20, ['#5e2020', '#6e2824', '#80322a', '#94402e']);
  for (let x = 0; x < GW; x++) {
    const m = x % 5;
    if (m < 3) { R(c, x, m === 1 ? 91 : 90, 1, m === 1 ? 3 : 4, '#6a2622'); }
  }
  R(c, 0, 94, GW, 1, '#4a1a1a');

  // ---- mid: Spasskaya tower ----
  const br = '#8a3428', brl = '#a84a38', brd = '#5e1f1c', wt = '#dcd0b8';
  R(c, 87, 68, 19, 46, br); R(c, 87, 68, 2, 46, brl); R(c, 103, 68, 3, 46, brd);
  R(c, 87, 68, 19, 1, wt); R(c, 87, 88, 19, 1, wt);
  R(c, 93, 102, 7, 12, '#2a1010'); R(c, 94, 101, 5, 1, '#2a1010');
  R(c, 93, 102, 7, 1, '#e0a860');                // lit gate
  ellipse(c, 96, 78, 4, 4, '#d8a840'); ellipse(c, 96, 78, 3, 3, '#1a1c30');
  P(c, 96, 76, '#d8a840'); P(c, 96, 77, '#d8a840'); P(c, 97, 78, '#d8a840');
  R(c, 89, 56, 15, 12, br); R(c, 89, 56, 2, 12, brl); R(c, 102, 56, 2, 12, brd);
  R(c, 89, 56, 15, 1, wt); R(c, 89, 67, 15, 1, wt);
  [89, 92, 100, 103].forEach(x => R(c, x, 52, 1, 4, wt));
  [92, 96, 100].forEach(x => R(c, x, 59, 1, 5, '#3a1410'));
  R(c, 91, 46, 11, 10, br); R(c, 91, 46, 1, 10, brl); R(c, 91, 46, 11, 1, wt);
  [93, 96, 99].forEach(x => R(c, x, 48, 2, 5, '#f0b860'));
  R(c, 92, 40, 9, 6, br); R(c, 92, 40, 9, 1, wt);
  for (let y = 26; y < 40; y++) {
    const w = 1 + Math.round((y - 26) / 13 * 8);
    R(c, 96 - (w >> 1), y, w, 1, '#255a3c');
    R(c, 96 - (w >> 1), y, Math.max(1, w >> 1), 1, '#3a7c52');
  }

  // ---- mid: St. Basil's ----
  for (let y = 58; y < 80; y++) {
    const w = 1 + Math.round((y - 58) / 21 * 8);
    for (let k = 0; k < w; k++) { const x = 130 - (w >> 1) + k; P(c, x, y, (x + y) % 4 === 0 || (x - y + 80) % 4 === 0 ? '#ecdcb8' : '#c04632'); }
  }
  P(c, 130, 55, '#f0c850'); R(c, 129, 56, 3, 2, '#f0c850'); P(c, 130, 53, '#f0c850'); P(c, 130, 54, '#f0c850');
  R(c, 125, 80, 11, 16, '#b0422e'); R(c, 125, 80, 1, 16, '#c85a42'); R(c, 135, 80, 1, 16, '#7a2a1e'); R(c, 125, 80, 11, 1, '#e8dcc4');
  [127, 130, 133].forEach(x => R(c, x, 84, 1, 3, '#4a2a20'));
  const big = [1, 1, 3, 5, 7, 9, 11, 11, 11, 9, 7, 5], small = [1, 1, 3, 5, 7, 9, 9, 9, 7, 5];
  drum(c, 122, 74, 96, 7); drum(c, 138, 76, 96, 7);
  drum(c, 116, 82, 96, 5); drum(c, 144, 82, 96, 5);
  onion(c, 122, 62, big, '#f0c040', '#3a8a4a', 'check');
  onion(c, 138, 64, big, '#e0702a', '#2e7a6a', 'stripe');
  onion(c, 116, 72, small, '#d83a2a', '#3a8a4a', 'spiral');

function carpet(c, x0, y0, w, h) {
  const cx = x0 + (w - 1) / 2, cy = y0 + (h - 1) / 2;
  const band = ['#e0b870', '#2e3458', '#b8403a', '#ecdcb4', '#2e3458', '#c8963e', '#8a2a2e'];
  for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) {
    const lx = x - x0, ly = y - y0, ex = Math.min(lx, w - 1 - lx), ey = Math.min(ly, h - 1 - ly), e = Math.min(ex, ey);
    let col;
    if (e === 0) col = '#2a1418';
    else if (e === 1 || e === 7) col = '#c8963e';
    else if (e < 7) {
      const along = ex < ey ? ly : lx;
      const zig = Math.abs((along % 8) - 4);
      col = Math.round(zig * 4 / 4) + 2 === e || Math.round(zig * 4 / 4) + 2 === e + 1 && zig === 4 ? '#b8403a' : '#262a4c';
    } else {
      const du = Math.abs(x - cx) / (w / 2 - 8), dv = Math.abs(y - cy) / (h / 2 - 8);

      else {

        const a = (lx - 8) % 9, b = (ly - 8) % 9;
        if ((a === 4 && b >= 3 && b <= 5) || (b === 4 && a >= 3 && a <= 5)) col = '#d8a850';
        else if ((a + b) % 9 === 0 && a % 3 === 0) col = '#5a1a22';

// Guitar drawn in its own (u along the neck, v across) space, rotated by `ang`.
function guitarPixel(u, v) {
  const av = Math.abs(v);
  if (u >= 64 && u < 73 && av < 2.6) {
    if (u < 65) return '#e8e0c8';                                   // nut
    if (av > 1.6) return (u - 65.5) % 2.6 < 1.2 ? '#f0d890' : null; // tuning pegs
    return '#3a2418';
  }
  const onString = u > 8.5 && Math.abs(av - 1) < 0.45;               // two strings, bridge to nut
  if (u > 33 && u < 64 && av < 2) {
    if ((u - 35) % 5 < 0.7) return '#b8a888';                        // frets
    if (onString) return '#c8b898';
    return v < 0 ? '#4a2c18' : '#2a1a10';
  }
  // smooth union of the two bouts, so the waist is a gentle curve, not a pinch
  const a = Math.hypot(u - 11, v) - 11, b = Math.hypot(u - 28.5, v) - 8.2, k = 9;
  const hk = Math.max(k - Math.abs(a - b), 0) / k;
  const body = Math.min(a, b) - hk * hk * k / 4;
  if (body >= 0) return null;
  if (body > -1.1) return '#5a2e14';
  if (onString) return '#efe4c8';
  const hole = Math.hypot(u - 24, v);
  if (hole < 3.1) return '#1a0f08';
  if (hole < 4.1) return '#e0b070';
  if (u > 7 && u < 9.2 && av < 4.5) return '#3a2418';                // bridge
  return v < -5 ? '#d8904a' : v > 6 ? '#a8602c' : '#c07838';
}
function guitar(c, bx, by, ang) {
  const s = Math.sin(ang), co = Math.cos(ang);
  for (let y = by - 80; y <= by; y++) for (let x = bx - 16; x <= bx + 24; x++) {
    const dx = x + 0.5 - bx, dy = by - (y + 0.5);
    const col = guitarPixel(dx * s + dy * co, dx * co - dy * s);
    if (col) P(c, x, y, col);
  }
}

const lightC = mk();
function buildLight() {
  const c = lightC.getContext('2d'), img = c.createImageData(W, H), d = img.data;
  const L = [
    { x: 369, y: 158, r: 210, c: [255, 170, 90], i: 1.2 },
    { x: 369, y: 135, r: 55, c: [255, 190, 120], i: 0.5 },
    { x: 369, y: 205, r: 80, c: [255, 180, 100], i: 0.45 },
    { x: 18, y: 172, r: 110, c: [255, 190, 110], i: 0.9 },
    { x: 200, y: 110, r: 180, c: [100, 125, 200], i: 0.7 },
    { x: 200, y: 110, r: 120, c: [225, 215, 215], i: 1.3 },  // city glow on the frame
    { x: 200, y: 176, r: 95, c: [235, 210, 190], i: 1.3 },   // ...and on the sill
    { x: 200, y: 188, r: 85, c: [150, 160, 215], i: 0.35 },
  ];
  L.forEach(l => l.x += OX);
  for (let gx = 20; gx < W; gx += 60) L.push({ x: gx, y: 24, r: 55, c: [255, 185, 110], i: 0.25 });
  const amb = [40, 35, 58], LV = 30;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const k = (y * W + x) * 4;
    let rr = amb[0], gg = amb[1], bb = amb[2];
    for (const l of L) {
      const dd = Math.hypot(x - l.x, y - l.y);
      if (dd < l.r) { const f = (1 - dd / l.r) ** 2 * l.i; rr += l.c[0] * f; gg += l.c[1] * f; bb += l.c[2] * f; }
    }
    const q = v => Math.min(255, Math.floor(v / 255 * LV + bay(x, y)) / LV * 255);
    d[k] = q(rr); d[k + 1] = q(gg); d[k + 2] = q(bb); d[k + 3] = 255;
  }
  c.putImageData(img, 0, 0);
}
function applyLight(src, dst) {
  const c = dst.getContext('2d');
  c.globalCompositeOperation = 'source-over';
  c.clearRect(0, 0, W, H);
  c.drawImage(src, 0, 0);
  c.globalCompositeOperation = 'multiply';
  c.drawImage(lightC, 0, 0);
  c.globalCompositeOperation = 'destination-in';
  c.drawImage(src, 0, 0);
  c.globalCompositeOperation = 'source-over';
}

const snow = [];
{
  const r = rng(99);
  for (let i = 0; i < 170; i++) {
    const layer = r() < 0.5 ? 0 : r() < 0.75 ? 1 : 2;
    snow.push({ x: r() * GW, y: r() * GH, l: layer, v: [5, 10, 17][layer] + r() * 4, a: 2 + r() * 4, p: r() * 6.28, f: 0.5 + r() });
  }
}
const smoke = [];
let smokeT = 0, winT = 0, T = 0, cafeOff = 0, earT = 0, tailT = 0;
let musicPlaying = false, recA = 0;   // the record spins only while music plays

function update(dt) {
  T += dt;
  for (const s of snow) {
    s.y += s.v * dt;
    s.x += Math.sin(T * s.f + s.p) * s.a * dt + 2 * dt;
    if (s.y > GH) { s.y = -2; s.x = Math.random() * GW; }
    if (s.x > GW) s.x -= GW;
  }
  smokeT -= dt;
  if (smokeT < 0) {
    smokeT = 0.35;
    const [cx, cy] = chimneys[Math.floor(Math.random() * chimneys.length)];
    smoke.push({ x: cx + Math.random() * 2, y: cy, age: 0, life: 4 + Math.random() * 2 });
  }
  for (const s of smoke) { s.age += dt; s.y -= 3.2 * dt; s.x += 2.2 * dt + Math.sin(s.age * 1.5) * 0.05; }
  while (smoke.length && smoke[0].age > smoke[0].life) smoke.shift();
  winT -= dt;
  if (winT < 0) {
    winT = 0.6 + Math.random() * 1.6;
    const w = cityWin[Math.floor(Math.random() * cityWin.length)];
    w.lit = !w.lit;
  }
  if (cafeOff > 0) cafeOff -= dt; else if (Math.random() < dt * 0.25) cafeOff = 0.08 + Math.random() * 0.25;
  if (earT > 0) earT -= dt; else if (Math.random() < dt * 0.15) earT = 0.25;
  if (tailT > 0) tailT -= dt; else if (Math.random() < dt * 0.2) tailT = 0.3;
  if (musicPlaying) recA += dt * 3.5;
}

function drawCat(c) {

  // tail: comes out from behind the body, lies on the sill, tip curls up and sways
  const sway = Math.round(Math.sin(T * 0.9) * 1.2 + (tailT > 0 ? 1 : 0));
  const tail = [[244, 182], [246, 182], [248, 182], [250, 182], [252, 182], [254, 181], [256, 180],

  // body

    const dy = (y - 178) / (6 + breath), dx = (x - 234) / 13;

  R(c, 224, 181, 20, 2, lt);

  // head (resting on paws, a bit raised)
  const hx = 220, hy = 176;

  const ey = earT > 0 ? 1 : 0;
  [[hx - 3, 0], [hx + 3, ey]].forEach(([ex, o]) => {
    P(c, ex, hy - 7 + o, out);
    R(c, ex - 1, hy - 6 + o, 3, 1, out); P(c, ex, hy - 6 + o, fur);
    R(c, ex - 2, hy - 5 + o, 5, 1, out); R(c, ex - 1, hy - 5 + o, 3, 1, fur); P(c, ex, hy - 5 + o, '#f0a0a0');
  });

}

// cover the screen; crop mostly the floor, never the 400px core or above the baseboard
// (portrait phones may crop down to the window and the nearest furniture)
const MIN_H = 256;
function fit() {
  const vw = innerWidth, vh = innerHeight;
  // portrait phones: zoom in until just the window with its frame fills the width;
  // the side walls go off-screen, the HUD and player sit on the ceiling / floor bands
  const MIN_W = vw < vh ? 184 : 400;
  const k = Math.min(Math.max(vw / W, vh / H), vw / MIN_W, vh / MIN_H);
  const cw = W * k, ch = H * k, excess = ch - vh;
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.style.left = (vw - cw) / 2 + 'px';
  cv.style.top = (excess > 0 ? -excess * 0.15 : -excess / 2) + 'px';
}
addEventListener('resize', fit); fit();

// Continue the ceiling and floor past the canvas edges (visible on tall screens),
// using the average colour of the canvas' top and bottom rows.
function extendBackdrop() {
  const avg = y => {
    const d = ctx.getImageData(0, y, W, 1).data; let r = 0, g = 0, b = 0;
    for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; }
    const n = d.length / 4; return `rgb(${r / n | 0},${g / n | 0},${b / n | 0})`;
  };
  document.getElementById('stage').style.background = `linear-gradient(${avg(0)} 0 50%, ${avg(H - 1)} 50% 100%)`;
}

const TRACKS = [
  { src: 'music/01.mp3', title: 'Трек 1' },
  { src: 'music/02.mp3', title: 'Трек 2' },
];
const XF = 4;                                   // crossfade, seconds
const $ = id => document.getElementById(id);
const decks = [new Audio(), new Audio()].map(a => { a.preload = 'auto'; return { a, g: 0 }; });
let deck = 0, ti = 0, fade = null;
let musicVol = 0.8, ambVol = 0.45;

function loadDeck(d, i) { decks[d].a.src = TRACKS[i].src; decks[d].a.currentTime = 0; }
loadDeck(0, 0);

// ambience: slow wind (brown noise) + vinyl crackle, generated with WebAudio
let actx = null, ambGain = null;
function initAmbience() {
  actx = new (window.AudioContext || window.webkitAudioContext)();
  const sr = actx.sampleRate, len = sr * 6;
  const brown = actx.createBuffer(1, len, sr), bd = brown.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; bd[i] = last * 3.5; }
  const crackle = actx.createBuffer(1, len, sr), cd = crackle.getChannelData(0);
  for (let i = 0; i < len; i++) if (Math.random() < 0.00045) {
    const amp = (0.25 + Math.random() * 0.75) * (Math.random() < 0.5 ? -1 : 1);
    for (let k = 0; k < 24 && i + k < len; k++) cd[i + k] += amp * Math.exp(-k / 4);
  }
  ambGain = actx.createGain(); ambGain.gain.value = ambVol * 0.5; ambGain.connect(actx.destination);

  const wind = actx.createBufferSource(); wind.buffer = brown; wind.loop = true;
  const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
  const windGain = actx.createGain(); windGain.gain.value = 0.55;
  const lfo = actx.createOscillator(); lfo.frequency.value = 0.07;
  const lfoDepth = actx.createGain(); lfoDepth.gain.value = 0.3;
  lfo.connect(lfoDepth).connect(windGain.gain);
  wind.connect(lp).connect(windGain).connect(ambGain);

  const cr = actx.createBufferSource(); cr.buffer = crackle; cr.loop = true;
  const hp = actx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1200;
  const crGain = actx.createGain(); crGain.gain.value = 0.35;
  cr.connect(hp).connect(crGain).connect(ambGain);

  wind.start(); cr.start(); lfo.start();
}

function setPlaying(on) {
  musicPlaying = on;
  $('ico-play').toggleAttribute('hidden', on); $('ico-pause').toggleAttribute('hidden', !on);
  $('play').setAttribute('aria-label', on ? 'Пауза' : 'Play');
  if (on) {
    if (!actx) initAmbience(); else actx.resume();
    if (fade) decks[fade.to].a.play();
    if (decks[deck].g === 0 && !fade) decks[deck].g = 1;
    decks[deck].a.play();
  } else {
    decks.forEach(d => d.a.pause());
    if (actx) actx.suspend();
  }
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = on ? 'playing' : 'paused';
}

function startFade(dur) {
  if (fade) finishFade();
  const to = 1 - deck;
  ti = (ti + 1) % TRACKS.length;
  loadDeck(to, ti);
  decks[to].g = 0;
  if (musicPlaying) decks[to].a.play();
  fade = { to, t0: performance.now(), dur: dur * 1000 };
  updateMeta();
}
function finishFade() {
  decks[deck].a.pause(); decks[deck].g = 0;
  deck = fade.to; decks[deck].g = 1; fade = null;
}

const fmt = s => isFinite(s) ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}` : '-:--';
function updateMeta() {
  $('p-title').textContent = TRACKS[ti].title;
  if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: TRACKS[ti].title, artist: 'Lofi Russia' });
}

function playerTick(now) {
  if (fade) {
    const k = Math.min(1, (now - fade.t0) / fade.dur);
    decks[deck].g = 1 - k; decks[fade.to].g = k;
    if (k >= 1) finishFade();
  } else if (musicPlaying) {
    const a = decks[deck].a;
    if (a.duration && a.duration - a.currentTime < XF) startFade(XF);
  }
  decks.forEach(d => d.a.volume = Math.max(0, Math.min(1, d.g * musicVol)));
  if (musicPlaying || fade) {
    const a = decks[fade ? fade.to : deck].a;
    $('p-sub').textContent = `${fmt(a.currentTime)} / ${fmt(a.duration)}`;
    $('p-bar').style.width = (a.duration ? a.currentTime / a.duration * 100 : 0) + '%';
  }
  requestAnimationFrame(playerTick);
}
requestAnimationFrame(playerTick);

function togglePlay() {
  if (!musicPlaying && $('p-title').textContent === 'Нажми play') updateMeta();
  setPlaying(!musicPlaying);
}
function nextTrack() { startFade(musicPlaying ? 1.2 : 0.01); }

$('play').onclick = togglePlay;
$('next').onclick = nextTrack;
$('fs').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();

function bindVol(id, set) {
  const el = $(id);
  const apply = () => { el.style.setProperty('--v', el.value + '%'); set(el.value / 100); };
  el.addEventListener('input', apply); apply();
}
bindVol('v-music', v => musicVol = v);
bindVol('v-amb', v => { ambVol = v; if (ambGain) ambGain.gain.value = v * 0.5; });

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('play', () => setPlaying(true));
  navigator.mediaSession.setActionHandler('pause', () => setPlaying(false));
  navigator.mediaSession.setActionHandler('nexttrack', nextTrack);
}

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.key !== ' ') return;
  const k = e.key.toLowerCase();
  if (k === 'h' || k === 'р') { $('hud').classList.toggle('off'); $('player').classList.toggle('off'); }
  else if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (k === 'n' || k === 'т') nextTrack();
  else if (k === 'f' || k === 'а') $('fs').click();
});
</script>
</body>
</html>
